<div class="toast-stack" aria-live="polite" aria-atomic="true">
  @for (toast of toasts(); track toast.id) {
    <div class="toast-item" [class]="'toast-' + toast.type">
      <div class="toast-content">
        <strong>{{ toast.type === 'success' ? 'Success' : toast.type === 'warning' ? 'Warning' : toast.type === 'danger' ? 'Error' : 'Info' }}</strong>
        <span>{{ toast.message }}</span>
      </div>
      <button type="button" class="toast-close" (click)="close(toast.id)">×</button>
    </div>
  }
</div>
